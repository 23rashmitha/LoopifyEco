server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: loopify-campus-backend
  
  # Default to MySQL with automatic fallback / switchable profile
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loopify_campus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# Loopify Application Custom Configuration
loopify:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
  algorithms:
    enforce-strict-reservation-locks: true
    min-lead-time-hours: 12
